<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rupee - Recipient Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="recipient-dashboard">
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="navbar-brand">Rupee Recipient</h1>
            <div class="navbar-right">
                <span class="user-info">Recipient</span>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>
    
    <div class="dashboard-container">
        <!-- Error message area -->
        <div id="error-message" class="error-message" style="display:none;"></div>
        <div id="success-message" class="success-message" style="display:none;"></div>
        
        <!-- Recipient Profile Section -->
        <section class="dashboard-section">
            <h2>Your Profile</h2>
            <div class="profile-card">
                <div class="profile-info">
                    <p><strong>Organization:</strong> <span id="recipient-name">-</span></p>
                    <p><strong>Eligibility Status:</strong> <span id="eligibility-status" class="status-badge">-</span></p>
                </div>
            </div>
        </section>
        
        <!-- Available Food Section -->
        <section class="dashboard-section">
            <h2>Available Surplus Food</h2>
            <div id="available-food-container">
                <div id="available-food-list" class="food-grid">
                    <!-- Food items will be loaded here -->
                </div>
            </div>
        </section>
        
        <!-- Your Requests Section -->
        <section class="dashboard-section">
            <h2>Your Requests</h2>
            <div class="table-container">
                <table id="my-requests-table" class="data-table">
                    <thead>
                        <tr>
                            <th>Request ID</th>
                            <th>Date</th>
                            <th>Requested Quantity (kg)</th>
                            <th>Status</th>
                            <th>Updated</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="no-data">No requests yet</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    
    <!-- Request Modal -->
    <div id="request-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Request Surplus Food</h2>
                <button id="close-modal" class="btn-close">&times;</button>
            </div>
            <form id="request-form" class="request-form">
                <input type="hidden" id="modal-surplus-id" name="surplus_id">
                <input type="hidden" id="modal-recipient-id" name="recipient_id">
                
                <div class="form-group">
                    <label for="modal-available-quantity">Available Quantity (kg)</label>
                    <input type="number" id="modal-available-quantity" readonly />
                </div>
                
                <div class="form-group">
                    <label for="request-quantity">Quantity to Request (kg) *</label>
                    <input 
                        type="number" 
                        id="request-quantity" 
                        name="quantity"
                        min="0.1"
                        step="0.01"
                        placeholder="Enter quantity"
                        required
                    />
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    Submit Request
                </button>
            </form>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recipient.js') }}"></script>
</body>
</html>
